spring:
  application:
    name: ${APP_NAME:eureka-server}

server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Este servidor NO se registra a si mismo ni descarga el registro (es el registro)
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}
  server:
    # false = las instancias caidas se sacan del registro rapido (ideal para demo)
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:5000}
    response-cache-update-interval-ms: ${EUREKA_CACHE_UPDATE_MS:3000}
